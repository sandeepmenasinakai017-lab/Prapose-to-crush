<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Love Me? ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            overflow: hidden;
            position: relative;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.85);
            padding: 40px 60px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            z-index: 10;
            max-width: 90%;
        }

        h1 {
            color: #d63384;
            margin-bottom: 30px;
            font-size: 2.5rem;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            min-height: 60px;
        }

        .btn {
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        #yes-btn {
            background-color: #ff4d6d;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4);
            z-index: 2;
        }

        #yes-btn:hover {
            background-color: #e43d5c;
            transform: scale(1.05);
        }

        #no-btn {
            background-color: #6c757d;
            color: white;
            position: absolute;
            /* Starts next to the yes button naturally */
            left: calc(50% + 20px); 
        }

        /* Celebration Screen Styles */
        .hidden {
            display: none !important;
        }

        .celebration {
            animation: fadeIn 0.8s ease forwards;
        }

        .celebration h2 {
            color: #ff4d6d;
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .celebration p {
            color: #555;
            font-size: 1.3rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Floating background hearts */
        .heart {
            position: absolute;
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.5rem;
            animation: floatUp 6s linear infinite;
            bottom: -20px;
            z-index: 1;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-105vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Floating Background Hearts -->
    <div class="heart" style="left: 10%; animation-duration: 5s;">❤️</div>
    <div class="heart" style="left: 30%; animation-duration: 7s; animation-delay: 1s;">💖</div>
    <div class="heart" style="left: 50%; animation-duration: 6s; animation-delay: 2s;">❤️</div>
    <div class="heart" style="left: 70%; animation-duration: 8s; animation-delay: 0.5s;">💕</div>
    <div class="heart" style="left: 90%; animation-duration: 5.5s; animation-delay: 1.5s;">❤️</div>

    <div class="container">
        <!-- Main Question Section -->
        <div id="question-box">
            <h1>Will you love me? 🥺❤️</h1>
            <div class="buttons">
                <button id="yes-btn" class="btn">Yes! 💕</button>
                <button id="no-btn" class="btn">No 😢</button>
            </div>
        </div>

        <!-- Success / Celebration Section -->
        <div id="success-box" class="celebration hidden">
            <h2>Yay! 🥰🎉</h2>
            <p>I knew you'd say yes! Best decision ever! ❤️✨</p>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('no-btn');
        const yesBtn = document.getElementById('yes-btn');
        const questionBox = document.getElementById('question-box');
        const successBox = document.getElementById('success-box');

        // Function to move the "No" button randomly inside the screen boundaries
        function moveNoButton() {
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;

            // Generate safe random coordinates within the viewport padding
            const randomX = Math.random() * (windowWidth - 150);
            const randomY = Math.random() * (windowHeight - 100);

            noBtn.style.position = 'fixed';
            noBtn.style.left = `${randomX}px`;
            noBtn.style.top = `${randomY}px`;
        }

        // Trigger escape behavior when hovering or trying to click "No"
        noBtn.addEventListener('mouseover', moveNoButton);
        noBtn.addEventListener('click', (e) => {
            e.preventDefault();
            moveNoButton();
        });

        // Trigger celebration when "Yes" is clicked
        yesBtn.addEventListener('click', () => {
            questionBox.classList.add('hidden');
            successBox.classList.remove('hidden');
        });
    </script>
</body>
</html>
